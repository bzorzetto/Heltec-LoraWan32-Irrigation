# Irrigazione
irrigation_unlimited:
  controllers:
    zones:
      - name: "Sprinkler Zona 1 "
        entity_id: "switch.elettrovalvola_1"
      - name: "Sprinkler Zona 2"
        entity_id: "switch.elettrovalvola_2"
      - name: "Sprinkler Zona 3"
        entity_id: "switch.elettrovalvola_3"
      - name: "Sprinkler Zona 4"
        entity_id: "switch.elettrovalvola_4"
      - name: "Sprinkler Zona 5"
        entity_id: "switch.elettrovalvola_5"
      - name: "Sprinkler Zona 6"
        entity_id: "switch.elettrovalvola_6"
      - name: "Sprinkler Zona 7"
        entity_id: "switch.elettrovalvola_7"
      - name: "Sprinkler Zona 8"
        entity_id: "switch.elettrovalvola_8"
    sequences:
      - delay: "00:20"
        schedules:
          - name: "Sunrise"
            time:
              sun: "sunrise"
          - name: "After sunset"
            time:
              sun: "sunset"
              after: "00:30"
        zones:
          - zone_id: 1
            duration: "00:01"
          - zone_id: 2
            duration: "00:01"
          - zone_id: 3
            duration: "00:01"
          - zone_id: 4
            duration: "00:01"
          - zone_id: 5
            duration: "00:01"
          - zone_id: 6
            duration: "00:01"
          - zone_id: 7
            duration: "00:01"
          - zone_id: 8
            duration: "00:01"
            
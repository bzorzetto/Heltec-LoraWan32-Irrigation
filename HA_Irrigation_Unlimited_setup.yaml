# ==============================================================
# DEFINISCE IL TEMPO DI IRRIGAZIONE
# ==============================================================
input_number:
  durata_irrigazione:
    name: Durata irrigazione
    min: 10
    max: 1800
    step: 1
    unit_of_measurement: "s"
    mode: box
    icon: mdi:timer-outline

mqtt:

  switch:

    # ==========================================================
    # ELETTROVALVOLA 1
    # ==========================================================

    - name: "Elettrovalvola 1"
      unique_id: "elettrovalvola_1"

      state_topic: >-
        application/def1c37a-cbb5-4e7e-8ef4-c6051cf85610/device/8df0764192dd2973/event/up

      value_template: >-
        {% if value_json.fPort == 10 and value_json.object is defined %}
          {{ value_json.object.uscita_1 | lower }}
        {% else %}
          {{ states('switch.elettrovalvola_1') }}
        {% endif %}

      payload_on: "true"
      payload_off: "false"

      state_on: "true"
      state_off: "false"

      command_topic: >-
        application/def1c37a-cbb5-4e7e-8ef4-c6051cf85610/device/8df0764192dd2973/command/down

      command_template: >-
        {
          "devEui": "8df0764192dd2973",
          "confirmed": false,
          "fPort": 10,
          "object": {
            "comando": {{ 1 if value == 'true' else 2 }},
            "uscita": 1,
            "tempo": {{ states('input_number.durata_irrigazione') | int(0) if value == 'true' else 0 }}
          }
        }

      qos: 0
      retain: false
      optimistic: false

      icon: mdi:valve



i2c:
  sda: GPIO4
  scl: GPIO5
  scan: True
  id: bus_a
  frequency: 400kHz
  

font:
  - file: Google_Sans_Medium.ttf
    id: my_font_1
    size: 12
  - file: Google_Sans_Bold.ttf
    id: my_font_2
    size: 12
  - file: materialdesignicons-webfont.ttf
    id: my_font_3
    size: 12
    
substitutions:
  display_timeout: '30000'
  
globals:
  - id: display_attivo
    type: bool
    restore_value: no
    initial_value: 'true'

  - id: display_ultimo_evento
    type: uint32_t
    restore_value: no
    initial_value: '0'
    
  - id: programma_locale
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: settore_locale
    type: int
    restore_value: no
    initial_value: '0'
  - id: durata_irrigazione
    type: uint32_t
    restore_value: no
    initial_value: '30'
    
  - id: irrigazione_uscita
    type: int
    restore_value: no
    initial_value: '0'

  - id: irrigazione_comando
    type: int
    restore_value: no
    initial_value: '0'

  - id: irrigazione_fine
    type: uint32_t
    restore_value: no
    initial_value: '0'
    
display:
  - platform: ssd1306_i2c
    model: SH1106_128X64
    address: 0x3C
    id: my_display
    update_interval: 500ms

    lambda: |-

      // --------------------------------------------------
      // Titolo
      // --------------------------------------------------

      it.printf(
        0, 0,
        id(my_font_2),
        "IRRIGAZIONE"
      );


      // --------------------------------------------------
      // Durata impostata
      // --------------------------------------------------

      uint32_t tempo = id(durata_irrigazione);

      uint32_t minuti = tempo / 60;
      uint32_t secondi = tempo % 60;


      it.printf(
        0, 20,
        id(my_font_1),
        "DURATA SETTORE"
      );


      it.printf(
        20, 36,
        id(my_font_2),
        "%02u:%02u",
        (unsigned int) minuti,
        (unsigned int) secondi
      );


      // --------------------------------------------------
      // Indicazione comando
      // --------------------------------------------------

      it.printf(
        0, 54,
        id(my_font_1),
        "PREMI P1 = AVVIA"
      );
       
sensor:

  - platform: rotary_encoder
    name: "Rotary Encoder"
    id: encoder

    pin_a:
      number: GPIO33
      inverted: true

    pin_b:
      number: GPIO32
      inverted: true

    min_value: 1
    max_value: 181
    publish_initial_value: true

    on_clockwise:
      then:
        - script.execute: display_on
        - script.stop: start_irrigation_script
        - script.execute: all_off

        - lambda: |-
            
            id(display_attivo) = true;
            id(display_ultimo_evento) = millis();

            int posizione = (int) id(encoder).state;

            if (posizione <= 1) {
              id(durata_irrigazione) = 30;
            } else {
              id(durata_irrigazione) =
                60 + ((posizione - 2) * 60);
            }

            ESP_LOGI(
              "irrigazione",
              "Encoder: posizione=%d durata=%u secondi",
              posizione,
              (unsigned) id(durata_irrigazione)
            );

    on_anticlockwise:
      then:
        - script.execute: display_on
        - script.stop: start_irrigation_script
        - script.execute: all_off

        - lambda: |-
            
            id(display_attivo) = true;
            id(display_ultimo_evento) = millis();

            int posizione = (int) id(encoder).state;

            if (posizione <= 1) {
              id(durata_irrigazione) = 30;
            } else {
              id(durata_irrigazione) =
                60 + ((posizione - 2) * 60);
            }

            ESP_LOGI(
              "irrigazione",
              "Encoder: posizione=%d durata=%u secondi",
              posizione,
              (unsigned) id(durata_irrigazione)
            );
          
  - platform: adc
    pin: GPIO34
    name: "Analog in 1"
    attenuation: 0db
    filters:
      - multiply: 1.6
    id: adc_1
  - platform: adc
    pin: GPIO35
    name: "Analog in 2"
    attenuation: 0db
    filters:
      - multiply: 1.6
    id: adc_2
#  - platform: wifi_signal
#    name: "WiFi Signal Alarm kc"
#    update_interval: 120s
 
pcf8574:
  - id: 'ingressi'
    address: 0x22
    pcf8575: false
  - id: 'uscite'
    address: 0x24
    pcf8575: false

# Pcf8572 Inputs
binary_sensor:
  - platform: gpio
    name: "Pulsante #0"
    id: P0
    pin:
      number: GPIO0
      inverted: true
    
  - platform: gpio
    name: "Pulsante #1"
    id: P1

    pin:
      number: GPIO13
      inverted: true

    on_press:
      then:
        - script.execute: display_on
        - lambda: |-
            id(display_attivo) = true;
            id(display_ultimo_evento) = millis();

            if (!id(programma_locale)) {

              ESP_LOGI(
                "irrigazione",
                "P1: avvio sequenza locale"
              );

            } else {

              ESP_LOGI(
                "irrigazione",
                "P1: STOP sequenza locale"
              );
            }

        - if:
            condition:
              lambda: 'return !id(programma_locale);'
            then:
              - script.execute: start_sequenza_locale

            else:
              - script.execute: all_off

              - lambda: |-
                  id(programma_locale) = false;
                  id(settore_locale) = 0;
                  id(irrigazione_uscita) = 0;
                  id(irrigazione_fine) = 0;

                  ESP_LOGI(
                    "irrigazione",
                    "SEQUENZA LOCALE INTERROTTA"
                  );
      
  - platform: gpio
    name: "Ingresso #1"
    id: "ingresso_1"
    pin:
      pcf8574: ingressi
      number: 0
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #2"
    id: "ingresso_2"
    pin:
      pcf8574: ingressi
      number: 1
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #3"
    id: "ingresso_3"
    pin:
      pcf8574: ingressi
      number: 2
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #4"
    id: "ingresso_4"
    pin:
      pcf8574: ingressi
      number: 3
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #5"
    id: "ingresso_5"
    pin:
      pcf8574: ingressi
      number: 4
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #6"
    id: "ingresso_6"
    pin:
      pcf8574: ingressi
      number: 5
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #7"
    id: "ingresso_7"
    pin:
      pcf8574: ingressi
      number: 6
      mode: INPUT
      inverted: true

  - platform: gpio
    name: "Ingresso #8"
    id: "ingresso_8"
    pin:
      pcf8574: ingressi
      number: 7
      mode: INPUT
      inverted: true


# Pcf8572 Outputs
switch:
  - platform: gpio
    restore_mode: RESTORE_DEFAULT_OFF
    name: "Uscita #1"
    id: "uscita_1"
    pin:
      pcf8574: uscite

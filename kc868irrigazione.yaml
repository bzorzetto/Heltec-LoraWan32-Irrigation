script:
  - id: start_sequenza_locale
    mode: restart
    then:

      # -----------------------------------------------
      # Avvia modalità locale
      # -----------------------------------------------

      - lambda: |-
          id(programma_locale) = true;
          id(settore_locale) = 1;

          ESP_LOGI(
            "irrigazione",
            "AVVIO SEQUENZA LOCALE - durata settore: %u secondi",
            (unsigned) id(durata_irrigazione)
          );

      # -----------------------------------------------
      # Spegne tutto prima di iniziare
      # -----------------------------------------------

      - script.execute: all_off

      # -----------------------------------------------
      # Attiva OUT1
      # -----------------------------------------------

      - switch.turn_on: uscita_1

      - lambda: |-
          id(irrigazione_uscita) = 1;

          id(irrigazione_fine) =
            millis() +
            ((uint32_t) id(durata_irrigazione) * 1000UL);

          ESP_LOGI(
            "irrigazione",
            "SEQUENZA LOCALE: OUT1 ON - %u secondi",
            (unsigned) id(durata_irrigazione)
          );
  - id: prossimo_settore_locale
    mode: restart
    then:

      - lambda: |-
          id(settore_locale)++;

          ESP_LOGI(
            "irrigazione",
            "Passaggio al settore %d",
            id(settore_locale)
          );

      - script.execute: all_off

      - lambda: |-
          int settore = id(settore_locale);

          switch (settore) {

            case 1:
              id(uscita_1).turn_on();
              break;

            case 2:
              id(uscita_2).turn_on();
              break;

            case 3:
              id(uscita_3).turn_on();
              break;

            case 4:
              id(uscita_4).turn_on();
              break;

            case 5:
              id(uscita_5).turn_on();
              break;

            case 6:
              id(uscita_6).turn_on();
              break;

            case 7:
              id(uscita_7).turn_on();
              break;

            case 8:
              id(uscita_8).turn_on();
              break;

            default:
              return;
          }

          id(irrigazione_uscita) = settore;

          id(irrigazione_fine) =
            millis() +
            ((uint32_t) id(durata_irrigazione) * 1000UL);

          ESP_LOGI(
            "irrigazione",
            "OUT%d ON - timer %u secondi",
            settore,
            (unsigned) id(durata_irrigazione)
          );
          
  - id: start_irrigation_script
    mode: single
    then:
      - switch.turn_on: uscita_1
      - delay: 2 min
      - switch.turn_off: uscita_1
      - switch.turn_on: uscita_2
      - delay: 2 min
      - switch.turn_off: uscita_2
      - switch.turn_on: uscita_3
      - delay: 2 min
      - switch.turn_off: uscita_3
      - switch.turn_on: uscita_4
      - delay: 2 min
      - switch.turn_off: uscita_4
      - switch.turn_on: uscita_5
      - delay: 2 min
      - switch.turn_off: uscita_5
      - switch.turn_on: uscita_6
      - delay: 2 min
      - switch.turn_off: uscita_6
      - switch.turn_on: uscita_7
      - delay: 2 min
      - switch.turn_off: uscita_7
      - switch.turn_on: uscita_8
      - delay: 2 min
      - switch.turn_off: uscita_8
  - id: all_off
    mode: single
    then:
      - switch.turn_off: uscita_1
      - switch.turn_off: uscita_2
      - switch.turn_off: uscita_3
      - switch.turn_off: uscita_4
      - switch.turn_off: uscita_5
      - switch.turn_off: uscita_6
      - switch.turn_off: uscita_7
      - switch.turn_off: uscita_8

  - id: send_status_ack
    mode: restart
    then:
      - lambda: |-
          uint8_t stato = 0;

          // Costruzione bitmap stato uscite
          if (id(uscita_1).state) stato |= 0x01;
          if (id(uscita_2).state) stato |= 0x02;
          if (id(uscita_3).state) stato |= 0x04;
          if (id(uscita_4).state) stato |= 0x08;
          if (id(uscita_5).state) stato |= 0x10;
          if (id(uscita_6).state) stato |= 0x20;
          if (id(uscita_7).state) stato |= 0x40;
          if (id(uscita_8).state) stato |= 0x80;

          // Pacchetto ACK:
          // A5 = identificatore ACK
          // 02 = stato uscite
          // XX = bitmap
          uint8_t ack[3];

          ack[0] = 0xA5;
          ack[1] = 0x02;
          ack[2] = stato;

          id(uart_0).write_array(ack, 3);

          ESP_LOGI(
            "irrigazione",
            "ACK STATO: A5 02 %02X",
            stato
          );
          
  - id: display_on
    mode: restart
    then:
      - lambda: |-
          id(display_attivo) = true;
          id(display_ultimo_evento) = millis();
          id(my_display).turn_on();

  - id: display_off
    mode: restart
    then:
      - lambda: |-
          id(display_attivo) = false;
          id(my_display).turn_off();        

interval:
  - interval: 50ms
    then:
    - lambda: |-
        static uint8_t buffer[4];
        static uint8_t index = 0;

        while (id(uart_0).available()) {

          uint8_t b;

          if (!id(uart_0).read_byte(&b)) {
            break;
          }

          ESP_LOGI(
            "irrigazione",
            "BYTE RX: 0x%02X",
            b
          );

          // --------------------------------------------------
          // Ricerca dell'inizio frame
          // --------------------------------------------------
          if (index == 0) {

             // Il frame deve iniziare con 0x01
             if (b != 0x01) {

               ESP_LOGW(
                   "irrigazione",
                   "Byte ignorato fuori frame: 0x%02X",
                   b
               );

               continue;
            }

            buffer[0] = b;
            index = 1;

            continue;
          }
          
          buffer[index++] = b;

          // ------------------------------------------------
          // FRAME COMPLETO
          // ------------------------------------------------

          if (index == 4) {

            ESP_LOGI(
              "irrigazione",
              "FRAME: %02X %02X %02X %02X",
              buffer[0],
              buffer[1],
              buffer[2],
              buffer[3]
            );

            uint8_t comando = buffer[0];
            uint8_t uscita  = buffer[1];

            uint16_t tempo =
              ((uint16_t)buffer[2] << 8) |
              buffer[3];

            ESP_LOGI(
              "irrigazione",
              "Comando=0x%02X Uscita=%d Tempo=%u s",
              comando,
              uscita,
              tempo
            );


            // =================================================
            // COMANDO 0x01
            // IRRIGAZIONE TEMPORIZZATA
            // =================================================

            if (comando == 0x01) {

              // -----------------------------------------------
              // Controllo parametri
              // -----------------------------------------------

              if (uscita < 1 || uscita > 8) {

                ESP_LOGW(
                  "irrigazione",
                  "ERRORE: uscita non valida: %d",
                  uscita
                );
              }

              else if (tempo == 0) {

                ESP_LOGW(
                  "irrigazione",
                  "ERRORE: tempo = 0"
                );
              }

              else {

                ESP_LOGI(
                  "irrigazione",
                  "Nuovo ciclo: OUT %d per %u secondi",
                  uscita,
                  tempo
                );


                // ---------------------------------------------
                // FERMA EVENTUALE CICLO PRECEDENTE
                // ---------------------------------------------

                ESP_LOGI(
                  "irrigazione",
                  "Spegnimento di tutte le uscite"
                );

                id(all_off).execute();

                // Invia ACK verso HA
                //id(send_status_ack).execute();

                // ---------------------------------------------
                // Invalida il vecchio timer
                // ---------------------------------------------

                id(irrigazione_uscita) = 0;
                id(irrigazione_fine) = 0;


                // ---------------------------------------------
                // Attiva la nuova uscita
                // ---------------------------------------------

                switch (uscita) {

                  case 1:
                    id(uscita_1).turn_on();
                    break;

                  case 2:
                    id(uscita_2).turn_on();
                    break;

                  case 3:
                    id(uscita_3).turn_on();
                    break;

                  case 4:
                    id(uscita_4).turn_on();
                    break;

                  case 5:
                    id(uscita_5).turn_on();
                    break;

                  case 6:
                    id(uscita_6).turn_on();
                    break;

                  case 7:
                    id(uscita_7).turn_on();
                    break;

                  case 8:
                    id(uscita_8).turn_on();
                    break;
                }

                // ACK: nuova uscita attivata
                id(send_status_ack).execute();
                
                // ---------------------------------------------
                // Memorizza il nuovo timer
                // ---------------------------------------------

                id(irrigazione_uscita) = uscita;

                id(irrigazione_fine) =
                  millis() +
                  ((uint32_t)tempo * 1000UL);


                ESP_LOGI(
                  "irrigazione",
                  "OUT %d ATTIVA - timer %u secondi",
                  uscita,
                  tempo
                );
              }
            }


            // =================================================
            // COMANDO 0x02
            // SPEGNIMENTO
            // =================================================

            else if (comando == 0x02) {

              // -----------------------------------------------
              // 0xFF = spegnimento generale
              // -----------------------------------------------

              if (uscita == 0xFF) {

                ESP_LOGI(
                  "irrigazione",
                  "COMANDO OFF GENERALE"
                );

                id(all_off).execute();

                id(irrigazione_uscita) = 0;
                id(irrigazione_fine) = 0;
                
                // Invia ACK a Homeassistant
                id(send_status_ack).execute();
              }


              // -----------------------------------------------
              // Spegnimento singola uscita
              // -----------------------------------------------

              else if (uscita >= 1 && uscita <= 8) {

                ESP_LOGI(
                  "irrigazione",
                  "OFF uscita %d",
                  uscita
                );

                switch (uscita) {

                  case 1:
                    id(uscita_1).turn_off();
                    break;

                  case 2:
                    id(uscita_2).turn_off();
                    break;

                  case 3:
                    id(uscita_3).turn_off();
                    break;

                  case 4:
                    id(uscita_4).turn_off();
                    break;

                  case 5:
                    id(uscita_5).turn_off();
                    break;

                  case 6:
                    id(uscita_6).turn_off();
                    break;

                  case 7:
                    id(uscita_7).turn_off();
                    break;

                  case 8:
                    id(uscita_8).turn_off();
                    break;
                }


                // ---------------------------------------------
                // Se era quella temporizzata, annulla timer
                // ---------------------------------------------

                if (id(irrigazione_uscita) == uscita) {

                  id(irrigazione_uscita) = 0;
                  id(irrigazione_fine) = 0;

                  ESP_LOGI(
                    "irrigazione",
                    "Timer annullato"
                  );
                }
              }


              else {

                ESP_LOGW(
                  "irrigazione",
                  "OFF: uscita non valida: %d",
                  uscita
                );
              }
            }


            // =================================================
            // COMANDO SCONOSCIUTO
            // =================================================

            else {

              ESP_LOGW(
                "irrigazione",
                "Comando sconosciuto: 0x%02X",
                comando
              );
            }


            // -----------------------------------------------
            // Preparati per il prossimo frame
            // -----------------------------------------------

            index = 0;
          }
        }
        

          // =================================================
          // SEQUENZA LOCALE
          // =================================================

          if (id(programma_locale) &&
              id(irrigazione_fine) != 0) {

            uint32_t adesso = millis();

            if ((int32_t)(adesso - id(irrigazione_fine)) >= 0) {

              ESP_LOGI(
                "irrigazione",
                "Timer OUT%d scaduto",
                id(irrigazione_uscita)
              );

              // -------------------------------------------
              // Se siamo arrivati a OUT8 -> FINE CICLO
              // -------------------------------------------

              if (id(settore_locale) >= 8) {

                ESP_LOGI(
                  "irrigazione",
                  "SEQUENZA LOCALE COMPLETATA"
                );

                id(all_off).execute();

                id(programma_locale) = false;
                id(settore_locale) = 0;
                id(irrigazione_uscita) = 0;
                id(irrigazione_fine) = 0;
              }

              // -------------------------------------------
              // Altrimenti passa al settore successivo
              // -------------------------------------------

              else {

                id(prossimo_settore_locale).execute();
              }
            }
          }    
  - interval: 100ms
    then:
      - lambda: |-
          if (id(irrigazione_uscita) != 0 &&
              (int32_t)(millis() - id(irrigazione_fine)) >= 0) {

            switch (id(irrigazione_uscita)) {

              case 1:
                id(uscita_1).turn_off();
                break;

              case 2:
                id(uscita_2).turn_off();
                break;

              case 3:
                id(uscita_3).turn_off();
                break;

              case 4:
                id(uscita_4).turn_off();
                break;

              case 5:
                id(uscita_5).turn_off();
                break;

              case 6:
                id(uscita_6).turn_off();
                break;

              case 7:
                id(uscita_7).turn_off();
                break;

              case 8:
                id(uscita_8).turn_off();
                break;
            }
            
            // ACK: nuova uscita attivata
            id(send_status_ack).execute();
                
            ESP_LOGI(
              "irrigazione",
              "USCITA %d OFF - TIMER SCADUTO",
              id(irrigazione_uscita)
            );
            
            id(irrigazione_uscita) = 0;
            id(irrigazione_fine) = 0;
          }
          
  - interval: 1s
    then:
      - lambda: |-

          // Durante l'irrigazione il display deve rimanere acceso
          if (id(irrigazione_uscita) != 0) {

            if (!id(display_attivo)) {
              id(display_attivo) = true;
              id(my_display).turn_on();
            }

            id(display_ultimo_evento) = millis();

            return;
          }

          // Nessuna irrigazione:
          // spegni dopo 30 secondi di inattività

          if (id(display_attivo) &&
              (millis() - id(display_ultimo_evento)) >= 30000UL) {

            ESP_LOGI(
              "display",
              "Nessuna attività da 30 secondi - DISPLAY OFF"
            );

            id(display_attivo) = false;
            id(my_display).turn_off();
          }